name: ci

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  # Does the desktop client call an operation this broker does not serve?
  #
  # Answering needs both trees and only one is reachable from here.
  # `wisent-ai/skarbiec-desktop` is private, and this workflow's GITHUB_TOKEN is
  # scoped to `wisent-ai/skarbiec` alone, so the second checkout answered
  # `##[error]Not Found` in about forty seconds on every run from 29748ec
  # onward. The credential is a named secret now, so the day it is provisioned
  # this check starts working with no further edit; until then it says which
  # credential is missing instead of dying inside a checkout that cannot
  # explain itself.
  #
  # What it must never do again is gate anything. `needs:` carries an implicit
  # `success()`, so one unsatisfiable checkout did not fail the gates - it
  # skipped them, along with the evidence, the tag and the deploy, on five
  # consecutive merges to main. Compilation, formatting and lints for this
  # crate depend on nothing outside this repository and now answer for
  # themselves.
  broker-client-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to report on a contract this run cannot read
        env:
          DESKTOP_CONTRACT_TOKEN: ${{ secrets.DESKTOP_CONTRACT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$DESKTOP_CONTRACT_TOKEN" ]; then
            printf '%s\n' "credential for the private sibling is present"
            exit 0
          fi
          printf '%s\n' \
            "This check compares the operations wisent-ai/skarbiec-desktop calls" \
            "against the ones src/net/operator.rs serves, so it has to read a" \
            "private sibling repository. The workflow GITHUB_TOKEN reads" \
            "wisent-ai/skarbiec and nothing else, which is why every run since" \
            "29748ec died on 'Not Found' rather than on a contract violation." \
            "" \
            "Missing, and it is one thing: a repository secret" \
            "DESKTOP_CONTRACT_TOKEN holding a fine-grained personal access token" \
            "or GitHub App installation token with Contents: read on" \
            "wisent-ai/skarbiec-desktop." \
            "" \
            "No secret already on this repository is a substitute." \
            "STADO_RELEASE_PUBLISHER_TOKEN publishes releases and" \
            "RELEASE_BOOTSTRAP_TOKEN is a one-shot signing bootstrap; neither is" \
            "a source-read credential for this sibling, and widening either one" \
            "to be one is a decision for whoever owns them." \
            "" \
            "A checked-in copy of the client's operation list is not a" \
            "substitute either: this check exists to catch the desktop tree" \
            "drifting from this one, and a snapshot in this repository would" \
            "only ever agree with itself." \
            "" \
            "This job fails alone. The Rust gates do not sit behind it."
          exit 1
      - uses: actions/checkout@v4
        with:
          path: broker
      - uses: actions/checkout@v4
        with:
          repository: wisent-ai/skarbiec-desktop
          path: desktop
          token: ${{ secrets.DESKTOP_CONTRACT_TOKEN }}
      - name: Validate broker-client contract
        run: |
          python3 broker/tools/check-broker-client-contract.py \
            broker/src/net/operator.rs \
            desktop/Sources/SkarbiecDesktop/BackendClient.swift

  # The gates are not spelled here any more. Four Rust repositories in this
  # pack had four different gate sets, and a fix applied to one of them
  # protected one repository; the shared workflow is one place to fix.
  #
  # No `needs:`. This job is the floor, and a floor that waits on a
  # cross-repository check is not a floor.
  gates:
    uses: wisent-ai/quality-control/.github/workflows/rust-gates.yml@7b0eb12f8e4a646bc1ae3438a42157ea13fdc63f

  evidence:
    needs: gates
    uses: wisent-ai/quality-control/.github/workflows/probierz-kronika.yml@12bf5fbe426c995d3124c96258a55e68d06d4880
    with:
      app-id: skarbiec
      target: tui
      spec: skarbiec-*.spec.mjs
      journeys: onboarding-first-use,initialize-vault,manage-secrets,delete-and-restore-secret,manage-users-and-sharing,recover-vault-access,use-json-output
      mode: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'pull-request' }}
      base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      head-sha: ${{ github.sha }}
      cargo-manifest: Cargo.toml
      binary-path: target/release/skarbiec
      receipt-public-key-fingerprint: a4da24776cebed924c126cd8f171a2e84299836e4daf7fb979d1523aff371b15
      kronika-sources: |-
        README.md
        docs
        src
        Cargo.toml
        .github
    secrets:
      PROBIERZ_RECEIPT_PRIVATE_KEY: ${{ secrets.PROBIERZ_RECEIPT_PRIVATE_KEY }}
      BRAMA_API_KEY: ${{ secrets.KRONIKA_BRAMA_API_KEY }}

  # A merged version bump becomes its tag here, rather than waiting for
  # someone to remember. The number is read from Cargo.toml, never invented,
  # and an existing tag is never moved - so the decision stays where the
  # refusal below says it belongs: in the commit that changed the version.
  tag:
    if: github.ref == 'refs/heads/main'
    needs: evidence
    uses: wisent-ai/quality-control/.github/workflows/tag-on-manifest-bump.yml@12bf5fbe426c995d3124c96258a55e68d06d4880
    with:
      release-workflow: ci.yml
    permissions:
      contents: write
      actions: write

  deploy:
    # Product repositories publish an immutable request; Stado's own control-plane
    # runner owns its registry, object store and release workers. Running the
    # coordinator on a GitHub-hosted runner made STADO_API_URL look configured
    # while registry reads still resolved to the runner's empty local store.
    if: github.ref == 'refs/heads/main'
    needs: evidence
    runs-on: ubuntu-latest
    concurrency:
      group: skarbiec-stable-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Submit the committed version to Stado
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STADO_RELEASE_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test -n "$version"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_SHA" \
            --arg version "$version" \
            '{event_type: "product-release", client_payload: {repository: $repository, ref: $ref, version: $version, channel: "stable"}}' \
            | gh api --method POST repos/wisent-ai/stado/dispatches --input -

  build:
    # Everything below is about publishing a tag, and none of it runs
    # otherwise. The untagged build lives in the shared gates now, so an
    # ordinary push builds once instead of twice.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: evidence
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            architecture: x86_64
          - os: macos-latest
            platform: darwin-arm64
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Refuse a tag that disagrees with the manifest
        # Every coordinate the tagged steps below write is spelled from
        # GITHUB_REF_NAME and from nothing else: the release, the archive
        # skarbiec-<tag>-<platform>.tar.gz, its .sha256, SKARBIEC_RELEASE_URI
        # stamped into the binary, and the extension update channel, whose
        # <updatecheck version> is the tag with its v removed. The binary inside
        # that archive reports CARGO_PKG_VERSION instead -- src/main.rs,
        # src/net/mcp.rs and src/onboarding.rs all publish it -- so when the two
        # disagree the release serves a build whose own answer contradicts the
        # name it was fetched by, and a Chrome client is offered an update whose
        # advertised version is not the one it installs.
        #
        # This is not hypothetical: in brama v0.2.9 through v0.2.13 were cut
        # from trees already declaring 0.3.0, so five releases published a
        # breaking change under patch-looking names. A published coordinate is
        # immutable, so the only repair left afterwards was prose. This refuses
        # before the first tagged artifact is built, which is the last point
        # where the mistake is still free.
        #
        # It refuses and never repairs: it does not bump Cargo.toml and does not
        # move the tag. Naming the number is mechanical; deciding to release is
        # not.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ -z "$declared" ]; then
            printf '%s\n' "Cargo.toml declares no version, so there is nothing for" \
              "$GITHUB_REF_NAME to agree with. Unchecked is not the same as agreeing."
            false
          fi
          if [ "$GITHUB_REF_NAME" != "v$declared" ]; then
            printf '%s\n' "tag $GITHUB_REF_NAME must equal v$declared, the version" \
              "Cargo.toml declares and the binary reports as its own." \
              "Publishing would permanently name release $GITHUB_REF_NAME, the" \
              "asset skarbiec-$GITHUB_REF_NAME-${{ matrix.platform }}.tar.gz and" \
              "its checksum after a version the archive does not contain, and" \
              "would advertise ${GITHUB_REF_NAME#v} on the extension update" \
              "channel. Either the tag names a version this tree does not carry," \
              "or the version change was never committed."
            false
          fi
          printf '%s\n' "tag $GITHUB_REF_NAME matches the declared version $declared"
      - name: Build provenance-stamped tagged artifact
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SKARBIEC_RELEASE_URI: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/skarbiec-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz
          SKARBIEC_RELEASE_COMMIT: ${{ github.sha }}
        run: cargo build --release
      - name: Publish versioned tagged artifact
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual_architecture="$(uname -m)"
          if [ "$actual_architecture" != "${{ matrix.architecture }}" ]; then
            printf '%s\n' "release runner architecture $actual_architecture does not match ${{ matrix.architecture }}"
            false
          fi
          archive="skarbiec-${GITHUB_REF_NAME}-${{ matrix.platform }}.tar.gz"
          checksum="${archive}.sha256"
          stage="$(mktemp -d)"
          cp target/release/skarbiec LICENSE NOTICE "$stage/"
          tar -czf "$archive" -C "$stage" .
          openssl dgst -sha256 -r "$archive" > "$checksum"
          gh release view "$GITHUB_REF_NAME" >/dev/null \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" "$archive" "$checksum"
      - name: Publish signed browser extension channel
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'linux-amd64'
        env:
          GH_TOKEN: ${{ github.token }}
          SKARBIEC_EXTENSION_PRIVATE_KEY_B64: ${{ secrets.SKARBIEC_EXTENSION_PRIVATE_KEY_B64 }}
        run: |
          if [ -z "$SKARBIEC_EXTENSION_PRIVATE_KEY_B64" ]; then
            printf '%s\n' "SKARBIEC_EXTENSION_PRIVATE_KEY_B64 is required for tagged releases"
            false
          fi
          private_key="$(mktemp)"
          trap 'rm -f "$private_key"' EXIT
          printf '%s' "$SKARBIEC_EXTENSION_PRIVATE_KEY_B64" | base64 --decode > "$private_key"
          crx="skarbiec-autofill.crx"
          update="skarbiec-autofill.xml"
          codebase="https://github.com/wisent-ai/skarbiec/releases/latest/download/$crx"
          version="${GITHUB_REF_NAME#v}"
          extension_id="$(cat deploy/chrome-extension-id)"
          python3 tools/package-crx3.py browser "$private_key" "$crx" "$update" "$codebase" "$version" "$extension_id"
          sha256sum "$crx" > "$crx.sha256"
          gh release upload "$GITHUB_REF_NAME" "$crx" "$crx.sha256" "$update"
