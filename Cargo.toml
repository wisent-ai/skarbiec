[package]
name = "skarbiec"
version = "0.2.38"
edition = "2021"
description = "Self-contained vault for sensitive values: at-rest encryption, multi-recipient sharing, scoped access grants, tamper-evident audit, and runtime injection. GPG owns encryption and key custody; bounded subprocess execution and in-process audit hashing keep the broker available under load."
license-file = "LICENSE"
repository = "https://github.com/wisent-ai/skarbiec"
readme = "README.md"

[[bin]]
name = "skarbiec"
path = "src/main.rs"

[[test]]
name = "items"
path = "tests/items/main.rs"

[[test]]
name = "credentials"
path = "tests/credentials/main.rs"

[[test]]
name = "onboarding"
path = "tests/onboarding/main.rs"

[[test]]
name = "schema"
path = "tests/schema/main.rs"

[[test]]
name = "vault"
path = "tests/vault/main.rs"

[[test]]
name = "migration"
path = "tests/migration/main.rs"

[[test]]
name = "grants"
path = "tests/grants/main.rs"

[[test]]
name = "operator-values"
path = "tests/operator-values/main.rs"

[[test]]
name = "operator-http"
path = "tests/operator-http/main.rs"

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
fs2 = "0.4"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
wait-timeout = "0.2"

# The fleet's failure vocabulary, and the trim rule that goes with it. Pinned to
# a commit rather than a branch: a vault's `error_code` is what a caller reads to
# decide whether to retry a refused redemption, so that word changing under this
# crate with no commit here recording it is not acceptable. The lock file is the
# second guard; this revision is the first.
#
# 92da74a corrects the catalogue's classification of 501 and 505 from
# `infra_down` to `config`. For skarbiec that revision is inert and was measured
# to be: the Rust diff against the previous pin is two match arms in
# `from_upstream_status`, a function this crate never calls, and skarbiec answers
# only 200, 400, 401, 403, 404, 409, 410 and 503, so no caller classifying its
# replies can meet a 501 or a 505 either.
wisent-errors = { git = "https://github.com/wisent-ai/wisent-errors", rev = "92da74a839b5d3202183f0a850745f6fc205ed12" }
