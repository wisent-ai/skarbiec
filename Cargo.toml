[package]
name = "skarbiec"
version = "0.1.0"
edition = "2021"
description = "Self-contained vault for sensitive values: at-rest encryption, multi-recipient sharing, scoped access grants, tamper-evident audit, and runtime injection. Cryptography delegated to gpg, openssl, and shasum; no hosted dependency."
license = "MIT"
repository = "https://github.com/wisent-ai/skarbiec"
readme = "README.md"

[[bin]]
name = "skarbiec"
path = "src/main.rs"

[dependencies]
aes = "0.8"
anyhow = "1.0"
serde_json = "1.0"
chrono = { version = "\u0030.\u0034", default-features = false, features = ["clock", "std"] }
ureq = { version = "\u0032.\u0031\u0032", default-features = false, features = ["json", "tls"] }
base64 = "0.22"
cbc = "0.1"
ed25519-dalek = "2.1"
libc = "0.2"
rand = "0.8"
pbkdf2 = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
sha1 = "0.10"
zeroize = "1.8"
semver = "1.0"

