[package]
name = "skarbiec"
version = "0.4.16"
edition = "2021"
description = "Self-contained vault for sensitive values: at-rest encryption, multi-recipient sharing, scoped access grants, tamper-evident audit, and runtime injection. Every cryptographic step runs in one process on Skarbiec's own dependency-free library; no keyring daemon or helper program stands between a request and its key."
license-file = "LICENSE"
repository = "https://github.com/wisent-ai/skarbiec"
readme = "README.md"
# No test target is built until the operator approves one with
# `tama tests approve`.
autotests = false

[[bin]]
name = "skarbiec"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fs2 = "0.4"
time = { version = "0.3", features = ["formatting", "macros"] }

# Every cryptographic step the vault takes: Skarbiec's own library, which
# depends on nothing (crates/crypto/README.md says why).
skarbiec-crypto = { path = "crates/crypto" }

# The fleet's failure vocabulary, and the trim rule that goes with it. Pinned to
# a commit rather than a branch: a vault's `error_code` is what a caller reads to
# decide whether to retry a refused redemption, so that word changing under this
# crate with no commit here recording it is not acceptable. The lock file is the
# second guard; this revision is the first.
#
# 92da74a corrects the catalogue's classification of 501 and 505 from
# `infra_down` to `config`. For skarbiec that revision is inert and was measured
# to be: the Rust diff against the previous pin is two match arms in
# `from_upstream_status`, a function this crate never calls, and skarbiec answers
# only 200, 400, 401, 403, 404, 409, 410 and 503, so no caller classifying its
# replies can meet a 501 or a 505 either.
wisent-errors = { git = "https://github.com/wisent-ai/wisent-errors", rev = "92da74a839b5d3202183f0a850745f6fc205ed12" }
stado-wait = { git = "https://github.com/wisent-ai/stado", rev = "692c0438d24117735c61373c0c178f1c1e21b080" }
csv = "1.3"
base64 = "0.22"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
form_urlencoded = "1.2"
percent-encoding = "2.3"
base32 = "0.5.1"

# The accept errors that end one connection rather than a listener
# (`src/net/http/service/accept.rs`) are named by errno on both platforms.
libc = "0.2"

[lints.clippy]
match_bool = "deny"
# A failure is said or returned, never dropped: `let _ = <Result>` and a
# statement `<Result>.ok();` are how a failed lock release, staging removal or
# audit append disappeared without a word.
let_underscore_must_use = "deny"
unused_result_ok = "deny"
# clippy.toml bans unwrap_or_default: a missing value is matched where its
# absence is a stated answer. This lint asks for the banned method in exactly
# those matches, so the two cannot both hold.
manual_unwrap_or_default = "allow"
